<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#F7F9FB">
  <meta name="description" content="Pitch Trainer — learn to hear notes, intervals, chords, scales, and progressions, one bite-sized lesson at a time.">
  <title>Pitch Trainer</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script>
    (function () { try { var s = JSON.parse(localStorage.getItem('pitchtrainer.v1') || '{}').settings || {}; var t = s.theme || 'system';
      if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t); } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); } })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="js/audio.js"></script>
  <script src="js/music.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

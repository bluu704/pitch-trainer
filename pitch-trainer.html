  --shadow: 0 1px 2px rgba(0,0,0,.3);
  --overlay: rgba(0,0,0,.6);
  color-scheme: dark;
}

.c-orange { --c: var(--orange); --c-d: var(--orange-d); }
.c-blue { --c: var(--blue); --c-d: var(--blue-d); }
.c-purple { --c: var(--purple); --c-d: var(--purple-d); }
.c-gold { --c: var(--gold); --c-d: var(--gold-d); }
.c-teal { --c: var(--teal); --c-d: var(--teal-d); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: var(--text); }
svg { display: block; }
.hl { color: var(--blue); font-weight: 700; }
.cc { color: var(--c); }

#app { position: relative; max-width: 560px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: calc(env(safe-area-inset-top) + 18px) 18px 24px; }

/* ---------- tab bar ---------- */
.tabbar { display: flex; border-top: 1px solid var(--border); background: var(--card); padding-bottom: env(safe-area-inset-bottom); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 8px; font-size: 11px; font-weight: 700; color: var(--faint); }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--orange); }

/* ---------- home ---------- */
.home-head { display: flex; justify-content: space-between; align-items: flex-start; }
.greet { font-size: 13px; color: var(--muted); font-weight: 600; }
h1 { font-size: 26px; font-weight: 900; margin: 2px 0 0; letter-spacing: -.2px; }
h2 { font-size: 17px; font-weight: 800; margin: 26px 0 12px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 5px 11px; border-radius: 999px; background: rgba(255,150,0,.14); color: var(--orange); font-weight: 800; font-size: 14px; }
.pill svg { width: 16px; height: 16px; }
.week { display: flex; justify-content: space-between; margin: 18px 4px 0; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 700; }
.wd .dot { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border-2); display: grid; place-items: center; font-size: 10px; color: var(--muted); }
.wd.today .dot { border: 2px solid var(--orange); color: var(--orange); }
.wd.today { color: var(--orange); }
.wd.hit .dot { background: var(--orange); border-color: var(--orange); color: #fff; }
.wd .dot svg { width: 14px; height: 14px; }

.session { position: relative; overflow: hidden; margin-top: 22px; border-radius: 20px; padding: 18px; background: var(--orange); color: #fff; box-shadow: 0 5px 0 var(--orange-d); }
.session::after { content: ''; position: absolute; right: -40px; top: -50px; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.12); }
.session .over { font-size: 11px; font-weight: 800; letter-spacing: .8px; opacity: .9; text-transform: uppercase; }
.session h3 { margin: 6px 0 4px; font-size: 22px; font-weight: 900; }
.session p { margin: 0 0 12px; font-size: 13px; opacity: .92; }
.session .time { position: absolute; top: 16px; right: 16px; z-index: 1; display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.22); font-size: 12px; font-weight: 800; }
.session .time svg { width: 13px; height: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.25); font-size: 12px; font-weight: 800; }
.session .btns { display: flex; gap: 10px; margin-top: 14px; position: relative; z-index: 1; }
.btn-white { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px; border-radius: 14px; background: #fff; color: var(--orange); font-weight: 900; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
.btn-white svg { width: 16px; height: 16px; }
.btn-ghost-w { flex: 1; padding: 13px; border-radius: 14px; background: rgba(255,255,255,.2); color: #fff; font-weight: 900; }

.skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.skill { text-align: left; background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 12px; box-shadow: 0 3px 0 var(--border); display: flex; flex-direction: column; min-height: 132px; }
.skill:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
.sk-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
.sk-ic svg { width: 20px; height: 20px; }
.skill b { margin-top: 14px; font-size: 14px; font-weight: 800; }
.skill small { font-size: 11px; color: var(--muted); }
.bar { height: 5px; border-radius: 9px; background: var(--soft); overflow: hidden; margin-top: auto; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 9px; transition: width .4s; }
.skill .bar { margin-top: 10px; }
.skill .cnt { font-size: 10.5px; color: var(--muted); margin-top: 6px; }

/* ---------- sheets / modals ---------- */
.ov { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: var(--overlay); animation: fade .18s; }
.ov.center { align-items: center; padding: 20px; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }
.sheet { width: 100%; max-width: 560px; background: var(--card); border-radius: 22px 22px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom) + 20px); animation: up .22s ease-out; max-height: 88vh; overflow-y: auto; }
.grab { width: 38px; height: 4px; border-radius: 4px; background: var(--border-2); margin: 0 auto 14px; }
.modal { width: 100%; max-width: 380px; background: var(--card); border-radius: 22px; padding: 22px; animation: pop .2s ease-out; max-height: 86vh; overflow-y: auto; }
.modal h3, .sheet h3 { margin: 0 0 6px; font-size: 19px; font-weight: 900; }
.modal p, .sheet p { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.5; }
.sh-head { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
.sh-head h3 { margin: 0; font-size: 18px; }
.sh-head p { margin: 0; font-size: 13px; }
.opt { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px; border-radius: 14px; border: 1.5px solid var(--border); box-shadow: 0 3px 0 var(--border); background: var(--card); margin-bottom: 12px; }
.opt .oi { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); }
.opt .oi svg { width: 18px; height: 18px; }
.opt div { flex: 1; } .opt b { display: block; font-size: 15px; } .opt small { color: var(--muted); font-size: 12px; }
.opt > svg { width: 16px; height: 16px; color: var(--faint); }
.opt.fill { background: var(--c); border-color: var(--c); box-shadow: 0 4px 0 var(--c-d); color: #fff; }
.opt.fill .oi { background: rgba(255,255,255,.25); color: #fff; } .opt.fill small, .opt.fill > svg { color: rgba(255,255,255,.85); }

.btn { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 14px; background: var(--c); color: #fff; font-weight: 900; font-size: 15px; box-shadow: 0 4px 0 var(--c-d); text-transform: none; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--c-d); }
.btn svg { width: 16px; height: 16px; }
.btn.sec { background: var(--card); color: var(--text); border: 1.5px solid var(--border); box-shadow: 0 3px 0 var(--border); }
.btn.danger { --c: var(--red); --c-d: var(--red-d); }
.btn.green { --c: var(--green); --c-d: var(--green-d); }
.btn[disabled] { background: var(--lock); color: var(--lock-ic); box-shadow: 0 4px 0 var(--border-2); cursor: default; }
.row-btns { display: flex; gap: 10px; }
.mt { margin-top: 10px; }

/* ---------- path ---------- */
.topbar { display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top) + 10px) 14px 6px; }
.iconbtn { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); background: var(--soft); flex-shrink: 0; }
.iconbtn svg { width: 18px; height: 18px; }
.pbar { flex: 1; height: 10px; border-radius: 9px; background: var(--soft); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--c); border-radius: 9px; transition: width .35s; }
.pcount { font-size: 12px; color: var(--muted); font-weight: 700; min-width: 34px; text-align: right; }
.path-title { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 18px 4px; }
.path-title h1 { font-size: 22px; }
.path { flex: 1; overflow-y: auto; padding: 8px 18px 60px; }
.unit { background: var(--c); color: #fff; border-radius: 16px; padding: 13px 16px; margin: 18px auto 18px; max-width: 360px; box-shadow: 0 4px 0 var(--c-d); }
.unit .over { font-size: 10.5px; font-weight: 800; letter-spacing: .9px; text-transform: uppercase; opacity: .9; }
.unit b { display: block; font-size: 18px; font-weight: 900; margin: 2px 0; }
.unit small { font-size: 12px; opacity: .92; }
.nodewrap { display: flex; flex-direction: column; align-items: center; margin: 8px 0; position: relative; }
.node { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--lock); color: var(--lock-ic); box-shadow: 0 5px 0 var(--border-2); position: relative; transition: transform .1s; }
.node:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--border-2); }
.node svg { width: 22px; height: 22px; }
.node.col { background: var(--c); color: #fff; box-shadow: 0 5px 0 var(--c-d); }
.node.cur::before { content: ''; position: absolute; inset: -7px; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--c) 25%, transparent); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.bubble { font-size: 11px; font-weight: 900; color: var(--c); letter-spacing: .6px; border: 1.5px solid var(--border); background: var(--card); padding: 5px 10px; border-radius: 9px; margin-bottom: 10px; position: relative; }
.bubble::after { content: ''; position: absolute; bottom: -6px; left: 50%; width: 10px; height: 10px; background: var(--card); border-right: 1.5px solid var(--border); border-bottom: 1.5px solid var(--border); transform: translateX(-50%) rotate(45deg); }
.stars { display: flex; gap: 2px; margin-top: 7px; color: var(--c); }
.stars svg { width: 10px; height: 10px; }
.stars .off { color: var(--lock); }
.bm-flag { position: absolute; top: -2px; right: -2px; width: 14px; height: 14px; color: var(--c); }
.pop { width: 100%; max-width: 360px; margin: 14px auto 6px; border-radius: 16px; padding: 14px; background: color-mix(in srgb, var(--c) 13%, var(--card)); border: 1.5px solid color-mix(in srgb, var(--c) 25%, var(--border)); animation: pop .15s; }
.pop.locked { background: var(--card); border-color: var(--border); box-shadow: var(--shadow); }
.pop b { display: block; font-size: 15px; font-weight: 800; }
.pop p { margin: 4px 0 12px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.pop .btn { padding: 11px; font-size: 13.5px; }

/* ---------- lesson ---------- */
.lesson { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.lbody { flex: 1; overflow-y: auto; padding: 8px 22px 16px; display: flex; flex-direction: column; }
.ltag { font-size: 12px; font-weight: 800; color: var(--c); margin: 10px 0 4px; }
.lbody h2 { font-size: 23px; font-weight: 900; margin: 0 0 6px; }
.lead { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
.lfoot { padding: 12px 22px calc(env(safe-area-inset-bottom) + 18px); }
.card { background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; }
.card .li { padding: 13px 14px; font-size: 14px; line-height: 1.45; border-bottom: 1px solid var(--border); }
.card .li:last-child { border-bottom: 0; }
.tile { width: 92px; height: 92px; margin: 10px auto 18px; border-radius: 22px; display: grid; place-items: center; font-size: 34px; font-weight: 900; color: var(--c); background: var(--card); border: 2px solid var(--border); box-shadow: 0 5px 0 var(--border); }
.tile.lg { width: auto; min-width: 92px; padding: 0 18px; font-size: 26px; }
.tile.tint { background: color-mix(in srgb, var(--c) 14%, var(--card)); border-color: color-mix(in srgb, var(--c) 40%, var(--border)); box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 60%, var(--border)); }
.tile:active { transform: translateY(3px); }
.hear { padding: 18px 16px 14px; }
.hear .big { text-align: center; font-size: 34px; font-weight: 900; color: var(--c); margin-bottom: 14px; }
.hear .row { display: flex; align-items: center; gap: 12px; }
.hear .row div { flex: 1; font-size: 14px; }
.hear .row small { display: block; color: var(--c); font-weight: 800; font-size: 12px; margin-top: 3px; }
.playc { width: 40px; height: 40px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; flex-shrink: 0; box-shadow: 0 3px 0 var(--c-d); }
.playc svg { width: 16px; height: 16px; margin-left: 2px; }
.ladder { position: relative; height: 230px; margin: 4px 0 12px; }
.ladder .rail { position: absolute; left: 50%; top: 10px; bottom: 10px; width: 2px; background: var(--border); transform: translateX(-50%); }
.rung { position: absolute; left: 50%; transform: translate(-50%, 50%); padding: 4px 12px; border-radius: 9px; font-weight: 900; font-size: 13px; background: var(--card); border: 1.5px solid var(--border); color: var(--text); box-shadow: 0 2px 0 var(--border); }
.rung.home { background: var(--c); color: #fff; border-color: var(--c); box-shadow: 0 3px 0 var(--c-d); }
.rung.new { border-color: var(--c); color: var(--c); }
.rung.home, .rung.home.new { color: #fff; }
.ladder .lab { position: absolute; right: 14px; font-size: 12px; font-weight: 800; color: var(--muted); transform: translateY(50%); }
.note-small { font-size: 12.5px; color: var(--muted); }

.list { display: flex; flex-direction: column; gap: 9px; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 13px; background: var(--card); border: 1.5px solid var(--border); box-shadow: 0 2px 0 var(--border); text-align: left; width: 100%; }
.lrow .nm { width: 108px; flex-shrink: 0; }
.lrow .nm b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .nm small { font-size: 11px; color: var(--muted); }
.lrow .vis { flex: 1; position: relative; height: 26px; }
.lrow .tri { width: 0; height: 0; border-left: 9px solid var(--c); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.lrow.new { border-color: var(--c); }
.ibar { position: absolute; left: 0; right: 26px; top: 10px; height: 7px; border-radius: 9px; background: color-mix(in srgb, var(--c) 15%, transparent); }
.ibar i { display: block; height: 100%; background: var(--c); border-radius: 9px; }
.ibar em { position: absolute; right: -24px; top: -5px; font-style: normal; font-size: 11px; font-weight: 800; color: var(--c); }
.dline { position: absolute; left: 4px; right: 4px; top: 12px; height: 1.5px; background: color-mix(in srgb, var(--c) 20%, transparent); }
.dd { position: absolute; top: 12px; width: 6px; height: 6px; border-radius: 50%; background: var(--c); transform: translate(-50%, -50%); }
.dd.ch { width: 12px; height: 12px; background: var(--purple); }
.dlab { position: absolute; bottom: -4px; font-size: 9px; color: var(--muted); }
.chips { display: flex; gap: 5px; justify-content: flex-end; flex: 1; }
.rn { min-width: 24px; height: 24px; padding: 0 4px; border-radius: 7px; display: grid; place-items: center; font-size: 10.5px; font-weight: 900; background: var(--c); color: #fff; position: relative; }
.rn.mi { background: transparent; color: var(--c); border: 1.5px solid color-mix(in srgb, var(--c) 50%, transparent); }
.rn.mk::after { content: ''; position: absolute; bottom: -6px; left: 4px; right: 4px; height: 2.5px; border-radius: 2px; background: var(--c); }

/* question */
.qtop { text-align: center; padding-top: 10px; }
.qtag { font-size: 12px; font-weight: 800; color: var(--c); }
.qtitle { font-size: 23px; font-weight: 900; margin: 8px 0 0; text-align: center; }
.qtitle .cc { color: var(--c); }
.wave { width: 100%; height: 150px; margin: auto 0; cursor: pointer; }
.qask { text-align: center; font-size: 13px; color: var(--muted); font-weight: 700; margin: 8px 0 12px; }
.grid { display: grid; gap: 9px; grid-template-columns: repeat(4, 1fr); max-width: 420px; margin: 0 auto; width: 100%; }
.grid.g2 { grid-template-columns: repeat(2, 1fr); }
.grid.g3 { grid-template-columns: repeat(3, 1fr); }
.grid.g1 { grid-template-columns: 1fr; }
.ch-b { padding: 13px 4px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--border); box-shadow: 0 3px 0 var(--border); font-weight: 800; font-size: 14px; min-height: 48px; line-height: 1.15; }
.ch-b small { display: block; font-size: 10px; color: var(--muted); font-weight: 700; }
.ch-b:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
.ch-b.sel { border-color: var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--card)); box-shadow: 0 3px 0 var(--c); }
.ch-b.ok { border-color: var(--green); background: color-mix(in srgb, var(--green) 14%, var(--card)); color: var(--green-d); box-shadow: 0 3px 0 var(--green); }
.ch-b.bad { border-color: var(--red); background: color-mix(in srgb, var(--red) 12%, var(--card)); color: var(--red-d); box-shadow: 0 3px 0 var(--red); }
.ch-b.dim { opacity: .45; }
.ch-b svg { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; margin-right: 4px; color: var(--c); }
.yn { display: flex; gap: 12px; }
.yn button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px; border-radius: 14px; font-weight: 900; font-size: 16px; color: #fff; }
.yn svg { width: 18px; height: 18px; }
.yn .y { background: var(--green); box-shadow: 0 4px 0 var(--green-d); }
.yn .n { background: var(--red); box-shadow: 0 4px 0 var(--red-d); }
.yn button:active { transform: translateY(3px); box-shadow: none; }
.yn button.faded { opacity: .35; }

.kb { position: relative; height: 150px; max-width: 420px; margin: 0 auto; width: 100%; }
.kw { position: absolute; top: 0; bottom: 0; border: 1.5px solid var(--border-2); background: #fff; border-radius: 0 0 9px 9px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-weight: 800; font-size: 12px; color: #444; }
.kbk { position: absolute; top: 0; height: 60%; background: #1d2530; border-radius: 0 0 7px 7px; z-index: 2; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 9.5px; color: #fff; font-weight: 800; }
:root[data-theme="dark"] .kbk { background: #05080c; border: 1px solid #3a4a5c; }
.kw.dis, .kbk.dis { opacity: .35; pointer-events: none; }
.kw.ok, .kbk.ok { background: var(--green); color: #fff; }
.kw.bad, .kbk.bad { background: var(--red); color: #fff; }

.feedback { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 22px calc(env(safe-area-inset-bottom) + 18px); animation: up .2s; z-index: 5; }
.feedback.good { background: color-mix(in srgb, var(--green) 18%, var(--card)); }
.feedback.bad { background: color-mix(in srgb, var(--red) 15%, var(--card)); }
.feedback h4 { margin: 0 0 4px; font-size: 19px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
.feedback h4 svg { width: 22px; height: 22px; }
.feedback.good h4 { color: var(--green-d); }
.feedback.bad h4 { color: var(--red-d); }
.feedback p { margin: 0 0 12px; font-size: 14px; color: var(--text); }
.feedback .cmp { display: flex; gap: 8px; margin-bottom: 12px; }
.feedback .cmp button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; border-radius: 11px; background: var(--card); border: 1.5px solid var(--border); font-weight: 800; font-size: 13px; }
.feedback .cmp svg { width: 14px; height: 14px; }

.done-ic { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-items: center; background: var(--c); color: #fff; box-shadow: 0 5px 0 var(--c-d); }
.done-ic svg { width: 36px; height: 36px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
.stat { border-radius: 14px; border: 2px solid var(--c); overflow: hidden; text-align: center; }
.stat small { display: block; background: var(--c); color: #fff; font-weight: 900; font-size: 11px; padding: 5px; letter-spacing: .5px; text-transform: uppercase; }
.stat b { display: block; padding: 10px 4px; font-size: 19px; font-weight: 900; color: var(--c); }
.bigstars { display: flex; justify-content: center; gap: 8px; color: var(--c); margin: 6px 0 4px; }
.bigstars svg { width: 34px; height: 34px; }
.bigstars .off { color: var(--lock); }

/* streak modal */

  <script>
/* Pitch Trainer — audio engine (Web Audio synthesis, no samples) */
(function () {
  'use strict';
  let ctx = null, master = null, analyser = null, bus = null, comp = null;
  let playId = 0;
  const pending = new Set();
  const ksCache = new Map();
  const waves = {};

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4;
      master = ctx.createGain(); master.gain.value = 0.9;
      analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
      master.connect(comp); comp.connect(analyser); analyser.connect(ctx.destination);
      newBus();
      buildWaves();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function newBus() { bus = ctx.createGain(); bus.gain.value = 1; bus.connect(master); }

  function buildWaves() {
    const mk = (amps) => {
      const real = new Float32Array(amps.length + 1), imag = new Float32Array(amps.length + 1);
      amps.forEach((a, i) => { imag[i + 1] = a; });
      return ctx.createPeriodicWave(real, imag);
    };
    waves.piano = mk([1, 0.55, 0.32, 0.22, 0.12, 0.09, 0.06, 0.035, 0.02, 0.012]);
    waves.clarinet = mk([1, 0.02, 0.62, 0.02, 0.42, 0.02, 0.22, 0.01, 0.16, 0.01, 0.08, 0, 0.05]);
  }

  function stopAll() {
    playId++;
    pending.forEach((t) => clearTimeout(t.timer) || t.resolve(false));
    pending.clear();
    if (!ctx || !bus) return;
    const b = bus, now = ctx.currentTime;
    b.gain.cancelScheduledValues(now);
    b.gain.setValueAtTime(b.gain.value, now);
    b.gain.linearRampToValueAtTime(0, now + 0.05);
    setTimeout(() => { try { b.disconnect(); } catch (e) {} }, 250);
    newBus();
  }

  function env(g, t, a, peak, d, rel) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.setValueAtTime(peak, t + Math.max(a, d - rel));
    g.gain.linearRampToValueAtTime(0.0001, t + d);
  }

  function vibrato(osc, t, f, depth, rate, delay) {
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = rate;
    lg.gain.setValueAtTime(0, t);
    lg.gain.linearRampToValueAtTime(f * depth, t + delay);
    lfo.connect(lg); lg.connect(osc.frequency);
    lfo.start(t); return lfo;
  }

  const V = {
    piano(m, t, d, vel, out) {
      const f = mtof(m);
      const decay = Math.max(0.6, Math.min(3.2, 1.6 + (72 - m) * 0.045));
      const end = t + d + 0.25;
      const g = ctx.createGain(), lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(Math.min(f * 9, 9000), t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(f * 2.2, 400), t + decay);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.32 * vel, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.11 * vel, t + 0.25);
      g.gain.exponentialRampToValueAtTime(0.0008, t + decay + 0.4);
      const rg = ctx.createGain();
      rg.gain.setValueAtTime(1, t); rg.gain.setTargetAtTime(0.0001, t + d, 0.07);
      [0, 3].forEach((det, i) => {
        const o = ctx.createOscillator();
        o.setPeriodicWave(waves.piano); o.frequency.value = f; o.detune.value = det;
        const og = ctx.createGain(); og.gain.value = i ? 0.45 : 0.7;
        o.connect(og); og.connect(lp); o.start(t); o.stop(end);
      });
      // hammer click
      const n = ctx.createBufferSource(); n.buffer = noiseBuf();
      const ng = ctx.createGain(), nf = ctx.createBiquadFilter();
      nf.type = 'bandpass'; nf.frequency.value = Math.min(f * 4, 5000); nf.Q.value = 1.2;
      ng.gain.setValueAtTime(0.05 * vel, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
      n.connect(nf); nf.connect(ng); ng.connect(out); n.start(t); n.stop(t + 0.05);
      lp.connect(g); g.connect(rg); rg.connect(out);
    },
    guitar(m, t, d, vel, out) {
      const src = ctx.createBufferSource(); src.buffer = ksBuffer(m);
      const g = ctx.createGain(), lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 4200;
      g.gain.setValueAtTime(0.55 * vel, t);
      g.gain.setValueAtTime(0.55 * vel, t + d);
      g.gain.linearRampToValueAtTime(0.0001, t + d + 0.12);
      src.connect(lp); lp.connect(g); g.connect(out);
      src.start(t); src.stop(t + d + 0.15);
    },
    cello(m, t, d, vel, out) {
      const f = mtof(m), g = ctx.createGain(), lp = ctx.createBiquadFilter(), pk = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = Math.min(2400, f * 9); lp.Q.value = 0.8;
      pk.type = 'peaking'; pk.frequency.value = 600; pk.gain.value = 5; pk.Q.value = 1.2;
      env(g, t, 0.09, 0.2 * vel, d, 0.22);
      [-4, 4].forEach((det) => {
        const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
        const l = vibrato(o, t, f, 0.005, 5.3, 0.35);
        o.connect(lp); o.start(t); o.stop(t + d + 0.05); l.stop(t + d + 0.05);
      });
      lp.connect(pk); pk.connect(g); g.connect(out);
    },
    clarinet(m, t, d, vel, out) {
      const f = mtof(m), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = Math.min(3200, f * 8);
      env(g, t, 0.05, 0.3 * vel, d, 0.12);
      const o = ctx.createOscillator(); o.setPeriodicWave(waves.clarinet); o.frequency.value = f;
      const l = vibrato(o, t, f, 0.003, 4.8, 0.5);
      o.connect(lp); lp.connect(g); g.connect(out);
      o.start(t); o.stop(t + d + 0.05); l.stop(t + d + 0.05);
    },
    trumpet(m, t, d, vel, out) {
      const f = mtof(m), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 1.5;
      lp.frequency.setValueAtTime(f * 1.2, t);
      lp.frequency.linearRampToValueAtTime(Math.min(f * 7, 6000), t + 0.07);
      lp.frequency.linearRampToValueAtTime(Math.min(f * 4.5, 4500), t + 0.25);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.2 * vel, t + 0.035);
      g.gain.linearRampToValueAtTime(0.15 * vel, t + 0.2);
      g.gain.setValueAtTime(0.15 * vel, t + Math.max(0.2, d - 0.1));
      g.gain.linearRampToValueAtTime(0.0001, t + d);
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
      const l = vibrato(o, t, f, 0.004, 5.6, 0.45);
      o.connect(lp); lp.connect(g); g.connect(out);
      o.start(t); o.stop(t + d + 0.05); l.stop(t + d + 0.05);
    },
    sine(m, t, d, vel, out) {
      const f = mtof(m), g = ctx.createGain();
      env(g, t, 0.025, 0.36 * vel, d, 0.18);
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.05);
    }
  };

  let _noise = null;
  function noiseBuf() {
    if (_noise) return _noise;
    const len = Math.floor(ctx.sampleRate * 0.1);
    _noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = _noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return _noise;
  }

  function ksBuffer(m) {
    if (ksCache.has(m)) return ksCache.get(m);
    const sr = ctx.sampleRate, f = mtof(m);
    const N = Math.max(2, Math.round(sr / f - 0.5));
    const len = Math.floor(sr * 3);
    const buf = ctx.createBuffer(1, len, sr), y = buf.getChannelData(0);
    // pluck: filtered noise burst
    let prev = 0;
    for (let i = 0; i < N; i++) { const r = Math.random() * 2 - 1; prev = prev * 0.45 + r * 0.55; y[i] = prev; }
    const damp = m > 76 ? 0.990 : m > 64 ? 0.994 : 0.996;
    for (let i = N; i < len; i++) y[i] = damp * 0.5 * (y[i - N] + y[i - N - 1 < 0 ? 0 : i - N - 1]);
    let peak = 0; for (let i = 0; i < N * 4; i++) peak = Math.max(peak, Math.abs(y[i]));
    const k = peak ? 0.9 / peak : 1;
    for (let i = 0; i < len; i++) y[i] *= k;
    ksCache.set(m, buf);
    return buf;
  }

  const INSTRUMENTS = ['piano', 'guitar', 'cello', 'clarinet', 'trumpet'];
  function resolveInstrument(name) {
    if (!name || name === 'random') return INSTRUMENTS[Math.floor(Math.random() * INSTRUMENTS.length)];
    return V[name] ? name : 'piano';
  }

  /* steps: [{t, notes:[midi], d, v}] ; returns Promise<boolean finished> */
  function play(steps, instrument, opts) {
    init();
    if (!opts || !opts.keep) stopAll();
    const inst = resolveInstrument(instrument);
    const t0 = ctx.currentTime + 0.04;
    let end = 0;
    for (const s of steps) {
      for (const n of s.notes) {
        let mm = n;
        // keep instruments in a playable register
        if (inst === 'cello') while (mm > 76) mm -= 12;
        V[inst](mm, t0 + s.t, s.d, s.v || 0.9, bus);
      }
      end = Math.max(end, s.t + s.d);
    }
    const id = playId;
    return new Promise((resolve) => {
      const tok = { resolve };
      tok.timer = setTimeout(() => { pending.delete(tok); resolve(id === playId); }, (end + 0.06) * 1000);
      pending.add(tok);
    });
  }

  function sfx(kind) {
    init();
    const t = ctx.currentTime + 0.01;
    const blip = (f, at, d, type, vol) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + at);
      g.gain.linearRampToValueAtTime(vol, t + at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + at + d);
      o.connect(g); g.connect(master); o.start(t + at); o.stop(t + at + d + 0.02);
    };
    if (kind === 'good') { blip(988, 0, 0.16, 'sine', 0.12); blip(1319, 0.08, 0.25, 'sine', 0.12); }

  };
  const SKILL_ICON = { pitch: I.note, intervals: I.notes, chords: I.chord, scales: I.stairs, progs: I.prog };

  /* ================= state ================= */
  const KEY = 'pitchtrainer.v1';
  const ADJ = ['Orchestral', 'Lyrical', 'Melodic', 'Harmonic', 'Rhythmic', 'Tuneful', 'Dulcet', 'Mellow', 'Vivid', 'Golden', 'Silver', 'Bright', 'Swift', 'Gentle', 'Bold', 'Jazzy', 'Velvet', 'Crystal'];
  const NOUN = ['Sonata', 'Cadence', 'Fugue', 'Chorus', 'Ballad', 'Overture', 'Etude', 'Nocturne', 'Rhapsody', 'Waltz', 'Prelude', 'Anthem', 'Serenade', 'Motif', 'Groove', 'Tempo', 'Encore', 'Harmony'];
  const randomName = () => pick(ADJ) + pick(NOUN) + rnd(1000, 9999);
  function defaults() {
    const prog = {}; M.SKILL_ORDER.forEach((k) => { prog[k] = { done: {}, bm: [] }; });
    return {
      v: 1, profile: { name: randomName(), since: dkey(new Date()) }, loggedOut: false,

      league: { tier: 0, week: null, result: null }, ideas: null, xp: 0

  let S = defaults();
  function load() {
    try {

        const d = defaults();
        S = Object.assign(d, raw);
        S.settings = Object.assign(d.settings, raw.settings || {});
        M.SKILL_ORDER.forEach((k) => { S.prog[k] = Object.assign({ done: {}, bm: [] }, (raw.prog || {})[k] || {}); });
      }
    } catch (e) { /* storage unavailable */ }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

  /* ================= dates ================= */
  function dkey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  const today = () => dkey(new Date());
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function monday(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; return addDays(x, -wd); }
  function streak() {
    let d = new Date(), n = 0;

    return n;
  }
  function bestStreak() {
    const ks = Object.keys(S.days).sort(); let best = 0, cur = 0, prev = null;
    ks.forEach((k) => { const d = new Date(k + 'T12:00:00'); cur = prev && Math.round((d - prev) / 864e5) === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; });
    return best;
  }
  function addXP(xp, lessons) {
    const k = today(), first = !S.days[k];
    S.days[k] = S.days[k] || { xp: 0, n: 0 };
    S.days[k].xp += xp; S.days[k].n += lessons || 1;
    S.xp = (S.xp || 0) + xp;
    save();
    return first;
  }
  function weekXP() {
    const m = monday(new Date()); let s = 0;
    for (let i = 0; i < 7; i++) { const d = S.days[dkey(addDays(m, i))]; if (d) s += d.xp; }
    return s;
  }

  /* ================= progress helpers ================= */
  const lessonsOf = (sk) => CUR[sk].lessons;
  const doneMap = (sk) => S.prog[sk].done;
  const doneCount = (sk) => Object.keys(doneMap(sk)).length;
  function curIdx(sk) { const L = lessonsOf(sk); for (let i = 0; i < L.length; i++) if (!doneMap(sk)[i]) return i; return L.length; }
  function learned(sk) {
    const set = new Set();
    lessonsOf(sk).forEach((l) => { if (doneMap(sk)[l.idx]) l.pool.forEach((x) => set.add(x)); });
    return M.ALL_ITEMS[sk].filter((x) => set.has(x));
  }
  function practicePool(sk) {
    let p = learned(sk);
    if (p.length < 2) {
      const u0 = CUR[sk].units[0].lessons.map((i) => lessonsOf(sk)[i]);
      const set = new Set(); u0.forEach((l) => l.pool.forEach((x) => set.add(x)));
      p = M.ALL_ITEMS[sk].filter((x) => set.has(x));
    }
    return p;
  }
  function practiceOpts(sk) {
    const L = lessonsOf(sk); let o = Object.assign({}, L[0].o);
    L.forEach((l) => { if (doneMap(sk)[l.idx]) o = Object.assign({}, o, l.o); });
    if (sk === 'pitch') { const oc = new Set(); L.forEach((l) => { if (doneMap(sk)[l.idx]) (l.o.oct || [4]).forEach((x) => oc.add(x)); }); o.oct = oc.size ? Array.from(oc) : [4]; }
    if (sk === 'intervals' && !o.dir) o.dir = 'up';
    delete o.arp;
    return o;
  }
  function itemStat(sk, it) { return S.items[sk + ':' + it] || [0, 0]; }
  function recordItem(sk, it, ok) { const k = sk + ':' + it; const v = S.items[k] || [0, 0]; v[0]++; if (ok) v[1]++; S.items[k] = v; }
  function skillAcc(sk) { let a = 0, c = 0; Object.keys(S.items).forEach((k) => { if (k.startsWith(sk + ':')) { a += S.items[k][0]; c += S.items[k][1]; } }); return a ? c / a : null; }
  const totalDone = () => M.SKILL_ORDER.reduce((s, k) => s + doneCount(k), 0);
  const stepsDone = () => [S.introSeen, Object.keys(S.days).length > 0, bestStreak() >= 2];

  const lbl = (sk, it, practice) => M.label(sk, it, { names: S.settings.names, transpose: practice && sk === 'pitch' ? (12 - S.settings.transpose) % 12 : 0 });
  const slbl = (sk, it, practice) => (sk === 'pitch' ? lbl(sk, it, practice) : M.shortLabel(sk, it));

  /* ================= theme ================= */
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function applyTheme() {
    const t = S.settings.theme === 'system' ? (mq && mq.matches ? 'dark' : 'light') : S.settings.theme;
    document.documentElement.setAttribute('data-theme', t);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#0F1720' : '#F7F9FB');
    try {
      const SB = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar;
      if (SB) { SB.setStyle({ style: t === 'dark' ? 'DARK' : 'LIGHT' }); SB.setBackgroundColor && SB.setBackgroundColor({ color: t === 'dark' ? '#0F1720' : '#F7F9FB' }); }
    } catch (e) { /* ignore */ }
  }
  if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);

  /* ================= navigation ================= */
  const nav = { tab: 'play', stack: [], overlay: null, menu: null, pathPop: null };
  function push(name, params) { nav.stack.push({ name, params: params || {} }); nav.pathPop = null; render(); }
  function pop() { A.stopAll(); stopTimers(); nav.stack.pop(); render(); }
  const top = () => nav.stack[nav.stack.length - 1];
  function handleBack() {
    if (nav.menu) { closeMenu(); return true; }
    if (nav.overlay) { if (nav.overlay.locked) return true; closeOverlay(); return true; }
    const t = top();
    if (t && (t.name === 'lesson' || t.name === 'practice') && !t.params.finished) { confirmQuit(); return true; }
    if (t) { pop(); return true; }

    return false;
  }
  try { history.pushState({ pt: 1 }, ''); } catch (e) { /* ignore */ }
  window.addEventListener('popstate', () => {

  });

  /* ================= overlays ================= */

    opts = opts || {};

    if (!el) { el = document.createElement('div'); el.id = 'ov'; document.body.appendChild(el); }

    el.onclick = (e) => { if (e.target === el && !o.locked) closeOverlay(); };

    const m = document.createElement('div'); m.className = 'menu';
    m.innerHTML = options.map((o, i) => `<button data-i="${i}" class="${String(o[0]) === String(current) ? 'on' : ''}">${esc(o[1])}</button>`).join('');
    document.body.appendChild(ovl); document.body.appendChild(m);
    const h = m.offsetHeight, vh = window.innerHeight;

  /* ================= tabs ================= */

  }

    if (nav.tab === 'ranks') checkLeague(true);
  }

  /* ---------- home ---------- */
  function greeting() { const h = new Date().getHours(); return h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
  function weekStrip() {
    const m = monday(new Date()), tk = today(), L = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    return `<div class="week">${L.map((l, i) => { const d = addDays(m, i), k = dkey(d), hit = !!S.days[k];

  }

  }

  /* ---------- path ---------- */
  function pathHTML(sk) {
    const s = M.SKILLS[sk], L = lessonsOf(sk), units = CUR[sk].units, cur = curIdx(sk), dm = doneMap(sk), d = doneCount(sk);

      const ud = u.lessons.filter((i) => dm[i]).length;
      html += `<div class="unit"><div class="over">Unit ${u.idx + 1} · ${ud} of ${u.lessons.length} done</div><b>${esc(u.t)}</b><small>${esc(u.d)}</small></div>`;
      u.lessons.forEach((i, j) => {
        const l = L[i];
        const off = Math.round(Math.sin(k * 0.85) * 52); k++;
        const done = !!dm[i], isCur = i === cur;

  function popHTML(sk, l, done, isCur) {
    const title = (l.idx + 1) + '. ' + l.t;

    if (done || isCur) {
      return `<div class="pop"><b>${esc(title)}</b><p>${esc(l.d)}${done ? ' · Best ' + (S.prog[sk].done[l.idx].acc || 0) + '%' : ''}</p>

      else el.scrollTop = Math.max(0, n.offsetTop - el.clientHeight / 2 + 40);
      el.onscroll = () => { nav.pathScroll = el.scrollTop; };
    }
  }

  /* ================= quiz generation ================= */
  const SCALE_ORDER = Object.keys(M.SCALES);
  function closeness(sk, a, b) {
    switch (sk) {
      case 'pitch': { const d = Math.abs(a - b) % 12; return Math.min(d, 12 - d); }
      case 'intervals': return Math.abs(a - b);
      case 'chords': {
        const x = M.CHORDS[a].iv, y = M.CHORDS[b].iv;
        let diff = Math.abs(x.length - y.length) * 1.5;
        for (let i = 0; i < Math.min(x.length, y.length); i++) if (x[i] !== y[i]) diff++;
        return diff;
      }
      case 'scales': return Math.abs(SCALE_ORDER.indexOf(a) - SCALE_ORDER.indexOf(b));
      case 'progs': {
        const x = M.PROGS[a].chords, y = M.PROGS[b].chords;
        let diff = Math.abs(x.length - y.length);
        for (let i = 0; i < Math.min(x.length, y.length); i++) if (x[i].toLowerCase() !== y[i].toLowerCase()) diff++;
        return diff;
      }
    }
    return 1;
  }
  function distractors(sk, target, pool, n, hard) {
    let c = pool.filter((x) => x !== target);
    if (c.length < n) c = c.concat(shuffle(M.ALL_ITEMS[sk].filter((x) => x !== target && !c.includes(x))).slice(0, n - c.length));
    if (hard) c = c.map((x) => [x, closeness(sk, target, x) + Math.random() * 0.9]).sort((p, q) => p[1] - q[1]).map((p) => p[0]);
    else c = shuffle(c);
    return c.slice(0, n);
  }
  function weightOf(sk, it, isNew) {
    const [a, c] = itemStat(sk, it);
    const err = a ? 1 - c / a : 0.4;
    return 1 + err * 3 + (isNew ? 1.5 : 0);
  }
  function weightedPick(sk, pool, avoid, newItems) {
    let cand = pool.filter((x) => !avoid.includes(x));
    if (!cand.length) cand = pool.filter((x) => x !== avoid[avoid.length - 1]);
    if (!cand.length) cand = pool;
    const w = cand.map((x) => weightOf(sk, x, newItems.includes(x)));
    let r = Math.random() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < cand.length; i++) { r -= w[i]; if (r <= 0) return cand[i]; }
    return cand[cand.length - 1];
  }
  function sigOf(sk, it, o) { return [it, o.oct && o.oct[0], o.root, o.dir, o.key, o.down].join('|'); }
  function makeQuestion(sk, pool, o, ctx) {
    const hard = ctx.hard;
    const small = pool.length === 1;
    const allowFind = (sk === 'pitch' || sk === 'intervals' || sk === 'chords');
    let kind;
    const r = Math.random();
    if (ctx.only) kind = ctx.only;
    else if (small) kind = r < 0.7 ? 'find' : 'yesno';
    else if (r < 0.12 && ctx.yn < ctx.maxYN) kind = 'yesno';
    else if (allowFind && r < 0.3) kind = 'find';
    else kind = 'identify';
    if (kind === 'yesno') ctx.yn++;
    let target, oc, tries = 0;
    do {
      target = weightedPick(sk, pool, ctx.recent, ctx.newItems || []);
      oc = M.concrete(sk, o);
      tries++;
    } while (ctx.seen.has(kind + sigOf(sk, target, oc)) && tries < 8);
    ctx.seen.add(kind + sigOf(sk, target, oc));
    ctx.recent.push(target); if (ctx.recent.length > (pool.length >= 4 ? 2 : 1)) ctx.recent.shift();
    const inst = A.resolveInstrument(o.inst || S.settings.instrument);
    const q = { sk, kind, target, o: oc, inst, sound: M.instance(sk, target, oc), reset: sk === 'pitch' && (S.settings.resetEar || o.reset) };
    if (kind === 'identify') q.choices = M.ALL_ITEMS[sk].filter((x) => pool.includes(x));
    if (kind === 'yesno') setYN(q, target, pool, Math.random() < 0.5, hard);
    if (kind === 'find') {
      const opts = shuffle([target].concat(distractors(sk, target, pool, 3, hard)));
      q.options = opts.map((it) => ({ it, sound: M.instance(sk, it, oc) }));
    }
    return q;
  }
  /* "Is this X?" — X is a known item; the sound is X or a look-alike (possibly not learned yet) */
  function setYN(q, asked, pool, yes, hard) {
    q.asked = asked;
    q.target = yes ? asked : distractors(q.sk, asked, pool, 1, hard)[0];
    q.sound = M.instance(q.sk, q.target, q.o);
    return q;
  }
  function makeQuiz(sk, pool, o, count, extra) {
    extra = extra || {};
    const ctx = { recent: [], seen: new Set(), yn: 0, maxYN: Math.max(1, Math.floor(count * 0.15)), newItems: extra.newItems || [] };
    const out = [];
    for (let i = 0; i < count; i++) {
      ctx.hard = extra.hard || i >= count * 0.4;
      ctx.only = extra.only;
      out.push(makeQuestion(sk, pool, o, ctx));
    }
    return out;
  }

  /* ================= lesson engine ================= */
  let LS = null; // current lesson session
  function startLesson(sk, idx, mode) {
    A.init();
    const l = lessonsOf(sk)[idx];
    S.lastSkill = sk; save();
    const steps = [];
    if (mode === 'lesson' && l.n.length) {
      learnSlides(sk, l).forEach((s) => steps.push({ type: 'slide', s }));
      const qc = makeQuiz(sk, l.pool, l.o, 3, { only: 'yesno', newItems: l.n });
      const ans = shuffle([true, false, Math.random() < 0.5]);
      qc.forEach((q, i) => setYN(q, l.n[i % l.n.length], l.pool, ans[i], i > 0));
      qc.forEach((q) => steps.push({ type: 'q', q, phase: 'quick' }));
    }
    let count = l.q, pool = l.pool;
    if (mode === 'testout') count = l.kind === 'final' ? l.q : 15;
    makeQuiz(sk, pool, l.o, count, { newItems: l.n, hard: mode === 'testout' || l.kind !== 'learn' }).forEach((q) => steps.push({ type: 'q', q, phase: 'quiz' }));
    LS = { mode, sk, idx, l, steps, i: 0, correct: 0, total: 0, requeue: 0, start: Date.now(), color: M.SKILLS[sk].color };
    push('lesson', {});
  }

      const q = makeQuiz(sk, learned(sk), practiceOpts(sk), 1, { only: 'identify', hard: i > 5 })[0];
      steps.push({ type: 'q', q, phase: 'quiz' });

  /* ---------- slides ---------- */

  function ladderHTML(pool, newItems) {

  function judge(ok, picked) {
    const L = LS, st = L.steps[L.i], q = st.q;

    if (st.phase === 'quiz' && !st.retry) { L.total++; if (ok) L.correct++; }
    recordItem(q.sk, q.target, ok);
    if (q.kind === 'yesno' && q.asked !== q.target) recordItem(q.sk, q.asked, ok);

    if (!ok && st.phase === 'quiz' && L.mode === 'lesson' && L.requeue < 6 && !st.retry) {

  /* ================= wave animation ================= */
  let waveRAF = null, lvl = 0, phase = 0;
  function startWave() {
    if (waveRAF) return;
    const loop = () => {
      const cvs = document.querySelector('canvas.wave');
      if (!cvs) { waveRAF = null; return; }
      const dpr = window.devicePixelRatio || 1, w = cvs.clientWidth, h = cvs.clientHeight;
      if (cvs.width !== w * dpr) { cvs.width = w * dpr; cvs.height = h * dpr; }
      const g = cvs.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, w, h);
      const target = A.level();
      lvl += (target - lvl) * 0.12;
      phase += 0.035 + lvl * 0.06;
      const col = getComputedStyle(cvs).getPropertyValue('--c').trim() || '#FF9600';
      const amp = h * (0.12 + Math.min(lvl, 1) * 0.3);
      for (let k = 5; k >= 0; k--) {
        g.beginPath();
        const a = amp * (k === 0 ? 1 : 0.35 + k * 0.1), f = 1.5 + k * 0.17, p = phase * (1 + k * 0.13) + k;
        for (let x = 0; x <= w; x += 3) {
          const t = x / w, env = Math.sin(Math.PI * t) * 0.7 + 0.3;
          const y = h / 2 + Math.sin(t * Math.PI * 2 * f + p) * a * env;
          x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
        }
        g.strokeStyle = col; g.globalAlpha = k === 0 ? 1 : 0.22; g.lineWidth = k === 0 ? 3 : 1.2;
        g.stroke();
      }
      g.globalAlpha = 1;
      waveRAF = requestAnimationFrame(loop);
    };
    waveRAF = requestAnimationFrame(loop);
  }

  function shieldSVG(col, sz) { return `<svg viewBox="0 0 64 72" width="${sz}" height="${sz * 1.12}"><path d="M32 2l27 9v22c0 18-12 30-27 37C17 63 5 51 5 33V11z" fill="${col}"/><path d="M32 2l27 9v22c0 18-12 30-27 37z" fill="rgba(0,0,0,.12)"/><path d="M32 18l5 10 11 1.5-8 7.5 2 11-10-5.5-10 5.5 2-11-8-7.5 11-1.5z" fill="rgba(255,255,255,.9)"/></svg>`; }
  function seeded(seed) { let a = 0; for (let i = 0; i < seed.length; i++) a = (a * 31 + seed.charCodeAt(i)) | 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function leagueBoard(weekK, tier, frac, myXP) {
    const r = seeded(weekK + ':' + tier);
    const bots = [];

    }
    bots.push({ name: S.profile.name, xp: myXP, me: true, color: '#FF9600' });
    return bots.sort((a, b) => b.xp - a.xp || (a.me ? -1 : 1));

      if (i === 0 && tier < TIERS.length - 1) rows += `<div class="zone upz">${I.up} Promotion zone</div>`;
      if (i === 13 && tier > 0) rows += `<div class="zone dnz">${I.down} Demotion zone</div>`;
      rows += `<div class="rk ${b.me ? 'me' : ''}"><span class="pos p${i + 1}">${i + 1}</span><span class="av" style="background:${b.color}">${esc(b.name[0])}</span><span class="nm">${esc(b.name)}${b.me ? ' (you)' : ''}</span><span class="xp">${b.xp} XP</span></div>`;
      if (i === 4 && tier < TIERS.length - 1) rows += `<div class="zone" style="color:var(--muted)">Top 5 advance</div>`;
    });
    return `<h1>Ranks</h1><div class="league"><div class="tiers">${TIERS.map((x, i) => `<span class="${i === tier ? 'on' : ''}">${shieldSVG(x[1], 22)}</span>`).join('')}</div>
      <div class="shield">${shieldSVG(t[1], 74)}</div><b>${t[0]} League</b><small>Top 5 advance to the next league · ${daysLeft} day${daysLeft === 1 ? '' : 's'} left</small></div>
      <div class="sec-t">This week</div><div class="group">${rows}</div>
      <p class="note-small" style="text-align:center;margin-top:12px">Earn XP from lessons, practice, and reviews to climb the board.</p>`;
  }

  /* ================= settings ================= */
  const INSTR = [['random', 'Random'], ['piano', 'Piano'], ['guitar', 'Guitar'], ['cello', 'Cello'], ['clarinet', 'Clarinet'], ['trumpet', 'Trumpet'], ['sine', 'Sine Wave']];
  function settingsHTML() {
    const st = S.settings;
    const row = (act, ic, title, sub, right, extra) => `<button class="srow" data-act="${act}" ${extra || ''}><span class="si ${act === 'delete' ? 'danger' : ''}">${ic}</span><div class="st"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</div>${right}</button>`;
    const sel = (v) => `<span class="val">${esc(v)}${I.chevUD}</span>`;
    const tog = (on) => `<span class="tog ${on ? 'on' : ''}"></span>`;
    const chev = I.chevR;
    return `<h1>Settings</h1>
      <div class="group" style="margin-top:18px"><button class="srow" data-act="profile"><span class="avatar">${I.user}</span><div class="st"><b>${esc(S.profile.name)}</b><small>Local profile · since ${esc(S.profile.since)}</small></div>${chev}</button></div>
      <div class="sec-t">Sound</div><div class="group">
        ${row('sel-instrument', I.vol, 'Instrument', '', sel(INSTR.find((x) => x[0] === st.instrument)[1]))}
        ${row('sel-names', I.note, 'Note names', '', sel(M.NAME_OPTIONS.find((x) => x[0] === st.names)[1]))}
        ${row('sel-transpose', I.swap, 'Transposition', 'Practice mode only', sel(M.TRANSPOSE_OPTIONS[st.transpose]))}
      </div>
      <div class="sec-t">Practice</div><div class="group">
        ${row('tg-keyboard', I.keyboard, 'Keyboard', 'Pitch trainer only', tog(st.keyboard))}
        ${row('tg-hints', I.bulb, 'Answer hints', 'Compare your pick with the answer after a miss', tog(st.hints))}
        ${row('tg-resetEar', I.rotate, 'Reset your ear', 'Short chords before each question', tog(st.resetEar))}
        ${row('tg-notifications', I.bell, 'Notifications', 'Daily practice reminder', tog(st.notifications))}
      </div>
      <div class="sec-t">Appearance</div><div class="group"><div class="srow"><span class="si">${I.sun}</span><div class="st"><b>Theme</b></div>
        <div class="seg" style="width:190px">${[['system', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].map(([k, l]) => `<button class="${st.theme === k ? 'on' : ''}" data-act="theme" data-k="${k}">${l}</button>`).join('')}</div></div></div>
      <div class="sec-t">Help</div><div class="group">
        ${row('how', I.help, 'How it works', '', chev)}
        ${row('board', I.msg, 'Feedback board', 'Share ideas and vote on what\'s next', chev)}
        ${row('contact', I.life, 'Contact us', '', chev)}
      </div>
      <div class="group" style="margin-top:18px">
        ${row('logout', I.logout, 'Log out', '', chev)}
        ${row('delete', I.trash, 'Delete account', '', chev)}
      </div>
      <div class="foot"><button data-act="doc" data-k="privacy">Privacy</button><button data-act="doc" data-k="terms">Terms</button><button data-act="doc" data-k="ack">Acknowledgements</button><button data-act="doc" data-k="log">Update log</button><div>Version ${VERSION}</div></div>`;
  }
  const DOCS = {
    privacy: ['Privacy', '<h4>Your data stays on your device</h4><p>Pitch Trainer stores your profile, progress, and settings only in this device\'s local storage. Nothing is sent to a server.</p><h4>No tracking</h4><p>There are no ads, analytics, or third-party trackers.</p><h4>Deleting data</h4><p>Use Settings → Delete account to erase everything instantly.</p>'],
    terms: ['Terms', '<p>Pitch Trainer is provided as-is for personal ear-training practice. You may use it freely. We make no guarantee that it is free of errors, and we are not liable for any damages arising from its use.</p>'],
    ack: ['Acknowledgements', '<ul><li>Sounds are synthesized live with the Web Audio API.</li><li>Typeface: Nunito (SIL Open Font License).</li><li>Android build: Capacitor.</li><li>Icons drawn in the style of Lucide (ISC License).</li></ul>'],
    log: ['Update log', `<h4>Version ${VERSION}</h4><ul><li>Five skills: Pitch, Intervals, Chords, Scales, Progressions — 149 lessons.</li><li>Duolingo-style skill paths with checkpoints, test-outs, and final exams.</li><li>Timed practice, mixed reviews, streaks, weekly leagues.</li><li>Light and dark themes.</li><li>Instruments: piano, guitar, cello, clarinet, trumpet, sine.</li><li>Adaptive quizzes: no easy repeats, trickier choices as you go.</li></ul>`]
  };
  function ideasList() {
    if (!S.ideas) S.ideas = [
      { t: 'Sight-singing mode with microphone', v: 41, me: false }, { t: 'Melodic dictation (multi-note)', v: 33, me: false },
      { t: 'MIDI keyboard input', v: 27, me: false }, { t: 'Custom note ranges', v: 19, me: false }, { t: 'More instruments (violin, flute, organ)', v: 15, me: false }
    ];
    return S.ideas;
  }
  function boardSheet() {
    const ideas = ideasList().slice().map((x, i) => Object.assign({ i }, x)).sort((a, b) => b.v - a.v);
    openOverlay(`<h3>Feedback board</h3><p>Share ideas and vote on what's next.</p>
      <div class="group" style="margin-bottom:14px">${ideas.map((x) => `<div class="idea"><button class="vote ${x.me ? 'on' : ''}" data-act="vote" data-i="${x.i}">${I.up}${x.v}</button><div>${esc(x.t)}${x.mine ? '<small>Your idea</small>' : ''}</div></div>`).join('')}</div>
      <input class="field" id="idea" maxlength="80" placeholder="Suggest an idea…"><button class="btn" data-act="addidea">Post idea</button>`);
  }
  async function syncNotifications(ask) {
    const LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
    try {
      if (LN) {
        await LN.cancel({ notifications: [{ id: 1 }] }).catch(() => {});
        if (!S.settings.notifications) return;
        let p = await LN.checkPermissions();
        if (p.display !== 'granted' && ask) p = await LN.requestPermissions();
        if (p.display !== 'granted') return;
        await LN.schedule({ notifications: [{ id: 1, title: 'Pitch Trainer', body: 'Time to train your ear! Keep your streak going.', schedule: { on: { hour: 19, minute: 0 }, allowWhileIdle: true } }] });
      } else if (ask && S.settings.notifications && 'Notification' in window && Notification.permission === 'default') {
        await Notification.requestPermission();
      }
    } catch (e) { /* not supported */ }
  }
  function webReminder() {
    try {
      if (!S.settings.notifications || window.Capacitor || !('Notification' in window) || Notification.permission !== 'granted') return;
      if (!S.days[today()] && new Date().getHours() >= 18 && streak() > 0) new Notification('Pitch Trainer', { body: 'Don\'t lose your ' + streak() + ' day streak — a quick session keeps it alive!' });
    } catch (e) { /* ignore */ }
  }

  /* ================= welcome ================= */
  function welcomeHTML() {
    return `<div class="screen"><div class="welcome"><div class="logo">${I.note}</div><h1>Pitch Trainer</h1><p>Train your ear, one note at a time.</p>
      <input class="field" id="wname" maxlength="24" value="${esc(S.profile.name)}" placeholder="Your name"><button class="btn" data-act="welcome">Get started</button></div></div>`;
  }

  /* ================= events ================= */
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    const sk = b.dataset.sk;
    switch (act) {
      case 'tab': nav.tab = b.dataset.k; render(); document.getElementById('tabscroll') && (document.getElementById('tabscroll').scrollTop = 0); break;
      case 'skill': skillSheet(sk); break;
      case 'learn': closeOverlay(); nav.pathScroll = null; push('path', { sk }); break;
      case 'practice': closeOverlay(); startPractice(sk); break;
      case 'back': pop(); break;
      case 'closeov': closeOverlay(); break;
      case 'session': { const nx = nextLesson(); startLesson(nx.sk, nx.l.idx, 'lesson'); break; }
      case 'review': startReview(); break;
      case 'how': closeOverlay(); startHowItWorks(); break;
      case 'node': { const i = +b.dataset.i; nav.pathPop = nav.pathPop === i ? null : i; const s = top().params.sk; const el = document.getElementById('pathscroll'); nav.pathScroll = el ? el.scrollTop : null; $app.innerHTML = pathHTML(s); afterPath(s); A.sfx('tap'); break; }
      case 'start': startLesson(top().params.sk, +b.dataset.i, 'lesson'); break;
      case 'testout': startLesson(top().params.sk, +b.dataset.i, 'testout'); break;
      case 'startbm': startLesson(sk, +b.dataset.i, 'lesson'); break;
      case 'bm': { const s = top().params.sk, i = +b.dataset.i, arr = S.prog[s].bm; const k = arr.indexOf(i); if (k >= 0) arr.splice(k, 1); else arr.push(i); save();
        const el = document.getElementById('pathscroll'); nav.pathScroll = el ? el.scrollTop : null; $app.innerHTML = pathHTML(s); afterPath(s); toast(k >= 0 ? 'Bookmark removed' : 'Bookmarked for review'); break; }
      case 'next': nextStep(); break;
      case 'quit': confirmQuit(); break;
      case 'doquit': closeOverlay(); stopTimers(); A.stopAll(); LS = null; PS = null; pop(); break;
      case 'finish': { const f = LS.result && LS.result.first; LS = null; afterFinish(f); break; }
      case 'replay': { const st = LS && top().name === 'lesson' ? LS.steps[LS.i] : null; if (st && st.q) A.play(st.q.sound.steps, st.q.inst); else if (PS && PS.q) A.play(PS.q.sound.steps, PS.q.inst); break; }
      case 'hear': { const it = JSON.parse(b.dataset.it), o = JSON.parse(b.dataset.o || '{}'); A.init(); A.play(M.instance(sk, it, M.concrete(sk, o)).steps, S.settings.instrument); break; }
      case 'hearpair': { A.init(); A.play([{ t: 0, notes: [60], d: 0.9 }, { t: 1.0, notes: [60 + +b.dataset.b], d: 1.3 }], S.settings.instrument); break; }
      case 'pick': {
        const it = JSON.parse(b.dataset.it);
        if (top().name === 'practice') practiceAnswer(it, b);
        else judge(it === LS.steps[LS.i].q.target, it);
        break;
      }
      case 'yn': { const q = LS.steps[LS.i].q; const yes = b.dataset.v === '1'; judge(yes === (q.asked === q.target), yes); break; }
      case 'opt': { const q = LS.steps[LS.i].q; const i = +b.dataset.i; if (LS.steps[LS.i].answered) { A.play(q.options[i].sound.steps, q.inst); break; } LS.sel = i;
        document.querySelectorAll('[data-act="opt"]').forEach((x) => x.classList.toggle('sel', +x.dataset.i === i));
        const sb = document.querySelector('[data-act="submit"]'); if (sb) sb.disabled = false;
        A.play(q.options[i].sound.steps, q.inst); break; }
      case 'submit': { const q = LS.steps[LS.i].q; if (LS.sel == null) break; judge(q.options[LS.sel].it === q.target, q.options[LS.sel].it); break; }
      case 'cmp': { const q = LS.steps[LS.i].q; const st = LS.steps[LS.i]; const y = compareItem(q, st.picked);
        A.play((b.dataset.w === 'you' ? M.instance(q.sk, y, q.o) : q.sound).steps, q.inst); break; }
      case 'pgo': PS.started = true; PS.left = PS.time; stopTimers(); timers.push(setInterval(practiceTick, 1000)); nextPracticeQ(); break;
      case 'pfinish': { const f = PS.result && PS.result.first; PS = null; afterFinish(f); break; }
      case 'pagain': { const s = PS.sk; PS = null; nav.stack.pop(); startPractice(s); break; }
      case 'theme': S.settings.theme = b.dataset.k; save(); render(); break;
      case 'profile': openOverlay(`<h3>Your profile</h3><p>Your name appears on the weekly leaderboard.</p><input class="field" id="pname" maxlength="24" value="${esc(S.profile.name)}"><div class="row-btns"><button class="btn sec" data-act="randname">Random</button><button class="btn" data-act="savename">Save</button></div>`); break;
      case 'randname': { const f = document.getElementById('pname'); if (f) f.value = randomName(); break; }
      case 'savename': { const v = (document.getElementById('pname').value || '').trim(); if (v) { S.profile.name = v; save(); } closeOverlay(); render(); break; }
      case 'board': boardSheet(); break;
      case 'vote': { const x = ideasList()[+b.dataset.i]; x.me = !x.me; x.v += x.me ? 1 : -1; save(); boardSheet(); break; }
      case 'addidea': { const v = (document.getElementById('idea').value || '').trim(); if (v) { ideasList().push({ t: v, v: 1, me: true, mine: true }); save(); boardSheet(); toast('Thanks for the idea!'); } break; }
      case 'contact': openOverlay(`<h3>Contact us</h3><p>Found a bug or have a question? Open an issue on GitHub and we'll get back to you.</p><a class="btn" href="${REPO}/issues" target="_blank" rel="noopener" style="text-decoration:none">${I.msg} Open GitHub issues</a><button class="btn sec mt" data-act="closeov">Close</button>`); break;
      case 'doc': openOverlay(`<h3>${DOCS[b.dataset.k][0]}</h3><div class="prose">${DOCS[b.dataset.k][1]}</div><button class="btn sec mt" data-act="closeov">Close</button>`); break;
      case 'logout': openOverlay(`<h3>Log out?</h3><p>Your progress stays saved on this device. You can pick up where you left off.</p><div class="row-btns"><button class="btn sec" data-act="closeov">Cancel</button><button class="btn" data-act="dologout">Log out</button></div>`, { center: true }); break;
      case 'dologout': closeOverlay(); S.loggedOut = true; save(); nav.stack = []; nav.tab = 'play'; render(); break;
      case 'delete': openOverlay(`<h3>Delete account?</h3><p>This permanently erases your profile, progress, streaks, and settings from this device. This can't be undone.</p><div class="row-btns"><button class="btn sec" data-act="closeov">Cancel</button><button class="btn danger" data-act="dodelete">Delete</button></div>`, { center: true }); break;
      case 'dodelete': closeOverlay(); try { localStorage.removeItem(KEY); } catch (er) { /* ignore */ } S = defaults(); S.loggedOut = true; save(); nav.stack = []; nav.tab = 'play'; syncNotifications(false); render(); break;
      case 'welcome': { const v = (document.getElementById('wname').value || '').trim(); if (v) S.profile.name = v; S.loggedOut = false; save(); A.init(); render(); break; }
      default:
        if (act.startsWith('tg-')) { const k = act.slice(3); S.settings[k] = !S.settings[k]; save(); render(); if (k === 'notifications') syncNotifications(true); }
        else if (act.startsWith('sel-')) {
          const k = act.slice(4);
          const opts = k === 'instrument' ? INSTR : k === 'names' ? M.NAME_OPTIONS : M.TRANSPOSE_OPTIONS.map((x, i) => [i, x]);
          openMenu(b, opts, S.settings[k], (v) => { S.settings[k] = v; save(); render(); if (k === 'instrument') { A.init(); A.play(M.instance('pitch', 0, { oct: [4] }).steps, v); } });
        }
    }
  });

  /* Android hardware back */
  function setupNative() {
    const C = window.Capacitor;
    if (!C || !C.Plugins) return;
    const App = C.Plugins.App;
    if (App && App.addListener) App.addListener('backButton', () => { if (!handleBack()) App.exitApp(); });
    try { C.Plugins.SplashScreen && C.Plugins.SplashScreen.hide(); } catch (e) { /* ignore */ }
  }

  /* ================= boot ================= */
  load();
  applyTheme();
  render();
  setupNative();
  syncNotifications(false);
  webReminder();
  document.addEventListener('visibilitychange', () => { if (document.hidden) A.stopAll(); else if (!top()) render(); });
  window.PT = { state: () => S, startLesson, nav };
})();

</script>
</body>
</html>
